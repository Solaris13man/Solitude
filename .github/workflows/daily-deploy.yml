# Rebuild and deploy once a day, just after UTC midnight.
#
# Why: the Daily Challenge archive (/daily/<date>/), the "Recent challenges"
# list and the "Today" badge are all baked at build time. Without a scheduled
# rebuild they freeze at the last push and new archive days 404.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID — the account id shown on the Workers overview page
# Until the secrets exist the job fails fast with a clear message (no partial deploys).
name: Daily deploy

on:
  schedule:
    - cron: '10 0 * * *' # 00:10 UTC, after the new daily day begins
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable the scheduled deploy."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
