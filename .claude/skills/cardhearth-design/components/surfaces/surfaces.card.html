<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-table-bg); color: var(--chrome-text); min-height: 100vh; }
  #root { padding: 22px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.5; font-weight: 700; }
</style>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Panel, GameCard, Hud, DailyHero } = window.CardHearthDesignSystem_7eedad;
    const SpiderArt = () => (
      <svg viewBox="0 0 240 135" width="100%" height="100%" aria-hidden="true">
        <rect x="40" y="30" width="50" height="70" rx="6" fill="#a32934" stroke="#fff" strokeOpacity="0.6"/>
        <rect x="150" y="30" width="50" height="70" rx="6" fill="#a32934" stroke="#fff" strokeOpacity="0.6"/>
        <rect x="93" y="8" width="54" height="76" rx="6" fill="#fcfcf7"/><text x="100" y="26" fontSize="13" fontWeight="700" fill="#1d2230">K♠</text>
        <rect x="93" y="40" width="54" height="76" rx="6" fill="#fcfcf7"/><text x="100" y="58" fontSize="13" fontWeight="700" fill="#1d2230">Q♠</text>
        <text x="120" y="104" fontSize="26" textAnchor="middle" fill="#1d2230">♠</text>
      </svg>
    );
    function Demo() {
      return (
        <>
          <div className="stack">
            <span className="lbl">Panels (fill · gold · soft) + HUD</span>
            <Panel pad="md"><strong>Always solvable.</strong> Every Mahjong board is winnable by design.</Panel>
            <Panel tone="gold" pad="md"><strong style={{color:'var(--gold)'}}>No guessing.</strong> Every Sudoku is solvable by pure logic — guaranteed.</Panel>
            <Hud items={[{label:'Time',value:'2:14'},{label:'Moves',value:38},{label:'Score',value:120}]} deal="#1042" />
          </div>
          <div className="stack">
            <span className="lbl">GameCard</span>
            <GameCard name="Spider" tagline="Build suit runs across ten columns" highlight="Every deal winnable" href="#"><SpiderArt/></GameCard>
            <span className="lbl">DailyHero</span>
            <DailyHero game="Klondike" date="March 14" status="Not played yet — keep your 6-day streak alive" href="#" stats={[{label:'Streak', value:'6 🔥'}, {label:'Best', value:14}, {label:'Solved', value:71}]} />
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
