<!-- @dsCard group="Colors" viewport="700x188" name="On-felt overlays" subtitle="How panels, cards & glass are built on the table — not solid fills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-table-bg); }
  .wrap { padding: 18px 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-lg); height: 90px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; color: var(--chrome-text); }
  .name { font-size: 11.5px; font-weight: 700; }
  .v { font-size: 10.5px; opacity: 0.8; }
  .cap { font-size: 11px; color: var(--chrome-text); margin: 0 0 12px; font-weight: 600; opacity: 0.9; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="cap">Surfaces on the felt are translucent black with a white hairline — never opaque blocks. They read on any felt color.</p>
    <div class="row">
      <div class="sw" style="background: var(--on-felt-fill); border: 1px solid var(--on-felt-line)"><span class="name">Card fill</span><span class="v">black / 0.22</span></div>
      <div class="sw" style="background: var(--on-felt-fill-soft); border: 1px solid var(--on-felt-line-soft)"><span class="name">Soft fill</span><span class="v">black / 0.18</span></div>
      <div class="sw" style="background: var(--on-felt-glass); border: 1px solid var(--on-felt-line)"><span class="name">Glass (buttons)</span><span class="v">white / 0.10</span></div>
      <div class="sw" style="background: var(--on-felt-fill); border: 1px solid var(--gold-veil)"><span class="name">Gold-veiled</span><span class="v">white / 217 gold</span></div>
    </div>
  </div>
</body>
</html>
