<!-- @dsCard group="Brand" viewport="700x200" name="Table surfaces" subtitle="Felt grain plus selectable wood & stone materials" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .wrap { padding: 18px 20px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: 10px; height: 92px; display: flex; align-items: flex-end; padding: 9px; box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
  .name { font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgb(0 0 0 / 0.6); position: relative; }
  .felt { background: var(--surface-table-bg); }
  .felt::after { content:''; position:absolute; inset:0; background: var(--texture-felt); background-size: 120px 120px; opacity: 0.8; }
  .oak { background: var(--texture-wood-oak); background-size: cover; }
  .walnut { background: var(--texture-wood-walnut); background-size: cover; }
  .marble { background: var(--texture-marble); background-size: cover; }
  .granite { background: var(--texture-granite); background-size: cover; }
  .cap { font-size: 11px; color: #5b6660; margin: 0 0 12px; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="cap">A woven-felt grain sits over the green gradient; players can swap to oak, walnut, marble or granite.</p>
    <div class="row">
      <div class="sw felt"><span class="name">Felt</span></div>
      <div class="sw oak"><span class="name">Oak</span></div>
      <div class="sw walnut"><span class="name">Walnut</span></div>
      <div class="sw marble"><span class="name">Marble</span></div>
      <div class="sw granite"><span class="name">Granite</span></div>
    </div>
  </div>
</body>
</html>
