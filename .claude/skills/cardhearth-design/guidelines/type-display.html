<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-table-bg); color: var(--chrome-text); }
  .wrap { padding: 20px 22px; }
  .spec { display: flex; align-items: baseline; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--on-felt-line-soft); }
  .spec:last-child { border-bottom: none; }
  .meta { margin-left: auto; font-size: 11px; opacity: 0.6; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spec"><span style="font-size: var(--text-5xl); font-weight: 800; letter-spacing: -0.01em; line-height: 1.05;">Free Solitaire</span><span class="meta">800 · 48px · -0.01em</span></div>
    <div class="spec"><span style="font-size: var(--text-3xl); font-weight: 800;">A new game every day</span><span class="meta">800 · 28.8px</span></div>
    <div class="spec"><span style="font-size: var(--text-xl); font-weight: 800;">Why play on CardHearth?</span><span class="meta">800 · 22.4px</span></div>
    <div class="spec"><span style="font-size: var(--text-lg); font-weight: 800;">Klondike</span><span class="meta">800 · 17.6px — card title</span></div>
  </div>
</body>
</html>
