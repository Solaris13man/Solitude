<!-- @dsCard group="Colors" viewport="700x200" name="Playing-card palette" subtitle="Card face cream, suit ink/red, and the classic red back" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .wrap { padding: 18px 20px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: 10px; height: 92px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-shadow: var(--shadow-card); }
  .name { font-size: 11.5px; font-weight: 700; }
  .hex { font-size: 11px; opacity: 0.8; font-variant-numeric: tabular-nums; }
  .cap { font-size: 11px; color: #5b6660; margin: 0 0 12px; font-weight: 600; }
  .glyph { font-size: 26px; line-height: 1; margin-bottom: auto; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="cap">Faces are rendered cream; suits use one ink + one red. Backs are a deep-red gradient.</p>
    <div class="row">
      <div class="sw" style="background: var(--card-cream); border:1px solid rgb(0 0 0 / .12); color: var(--ink-black)"><span class="glyph">♠</span><span class="name">Card cream</span><span class="hex">#fcfcf7</span></div>
      <div class="sw" style="background: var(--card-cream); border:1px solid rgb(0 0 0 / .12); color: var(--ink-black)"><span class="glyph">♣ A</span><span class="name">Ink black</span><span class="hex">#1d2230</span></div>
      <div class="sw" style="background: var(--card-cream); border:1px solid rgb(0 0 0 / .12); color: var(--suit-red)"><span class="glyph">♥ ♦</span><span class="name">Suit red</span><span class="hex">#c2273a</span></div>
      <div class="sw" style="background: linear-gradient(155deg, var(--card-back-a), var(--card-back-b)); color:#fff"><span class="name">Back light</span><span class="hex">#b03030</span></div>
      <div class="sw" style="background: var(--card-back-b); color:#fff"><span class="name">Back deep</span><span class="hex">#8c1f26</span></div>
    </div>
  </div>
</body>
</html>
