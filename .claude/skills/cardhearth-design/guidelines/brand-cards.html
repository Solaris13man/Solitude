<!-- @dsCard group="Brand" viewport="700x260" name="Card faces — Ink deck" subtitle="The premium hand-drawn 'ink-shadow' deck: minimal pips, illustrated courts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-table-bg); }
  .wrap { padding: 20px 22px; }
  .cap { font-size: 11px; color: var(--chrome-text); margin: 0 0 14px; font-weight: 600; opacity: 0.9; }
  .fan { display: flex; gap: 10px; }
  .card { width: 84px; aspect-ratio: 100/140; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: var(--shadow-playcard); }
  .card img { width: 100%; height: 100%; object-fit: fill; display: block; }
  .court { box-shadow: var(--shadow-playcard-hover); transform: translateY(-6px); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="cap">Faces are full-bleed artwork: clean red/black indices, grayscale illustrated court cards. One of six selectable decks.</p>
    <div class="fan">
      <div class="card"><img src="../assets/cards/ink-shadow/S1.webp" alt="Ace of spades"></div>
      <div class="card"><img src="../assets/cards/ink-shadow/H1.webp" alt="Ace of hearts"></div>
      <div class="card"><img src="../assets/cards/ink-shadow/D7.webp" alt="Seven of diamonds"></div>
      <div class="card"><img src="../assets/cards/ink-shadow/C10.webp" alt="Ten of clubs"></div>
      <div class="card court"><img src="../assets/cards/ink-shadow/S11.webp" alt="Jack of spades"></div>
      <div class="card court"><img src="../assets/cards/ink-shadow/H12.webp" alt="Queen of hearts"></div>
      <div class="card court"><img src="../assets/cards/ink-shadow/S13.webp" alt="King of spades"></div>
    </div>
  </div>
</body>
</html>
