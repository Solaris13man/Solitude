<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" role="img" aria-label="CardHearth">
  <defs>
    <radialGradient id="tileR" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1d7a42"/>
      <stop offset="58%" stop-color="#135c32"/>
      <stop offset="100%" stop-color="#0e4526"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd95e" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ffd95e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffd95e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe39a"/>
      <stop offset="52%" stop-color="#ffc24b"/>
      <stop offset="100%" stop-color="#ef9a2e"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf8ef"/>
      <stop offset="100%" stop-color="#efe7d2"/>
    </linearGradient>
    <filter id="shR" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- rich CardHearth mark, scaled into a 64px tile -->
  <g transform="translate(8,8) scale(0.125)">
    <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#tileR)"/>
    <rect x="40" y="40" width="432" height="432" rx="94" fill="none" stroke="#ffd95e" stroke-opacity="0.32" stroke-width="3"/>
    <rect x="158" y="130" width="196" height="272" rx="22" fill="#06301a" opacity="0.45" filter="url(#shR)"/>
    <rect x="158" y="120" width="196" height="272" rx="22" fill="url(#cardR)"/>
    <circle cx="256" cy="256" r="118" fill="url(#glowR)"/>
    <path transform="translate(184,178) scale(6)" d="M12 21s-9-5.5-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-9 12-9 12z" fill="url(#heartR)"/>
    <path transform="translate(176,140) scale(0.95)" d="M12 21s-9-5.5-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-9 12-9 12z" fill="#ef9a2e" opacity="0.85"/>
  </g>

  <!-- wordmark for dark / on-felt backgrounds -->
  <text x="84" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.8" fill="#f3f6f2">Card<tspan fill="#ffd95e">Hearth</tspan></text>
</svg>
