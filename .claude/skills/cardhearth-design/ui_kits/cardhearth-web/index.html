<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardHearth — Free Solitaire, Card & Puzzle Games</title>
<link rel="icon" href="../../assets/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    color: var(--chrome-text);
    font-family: var(--font-sans);
    background: var(--surface-table-bg);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
  }
  /* woven-felt grain over the green gradient, fixed like the real table */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image: var(--texture-felt);
    background-size: 220px 220px;
    background-repeat: repeat;
  }
  select { font-family: var(--font-sans); }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="art.jsx"></script>
  <script type="text/babel" src="Home.jsx"></script>
  <script type="text/babel" src="GameShell.jsx"></script>
  <script type="text/babel">
    function App() {
      const [view, setView] = React.useState({ screen: 'home', game: null });
      React.useEffect(() => { window.scrollTo(0, 0); }, [view]);
      if (view.screen === 'game') {
        return <window.GameShell gameId={view.game} onHome={() => setView({ screen: 'home', game: null })} />;
      }
      return <window.Home onOpen={(game) => setView({ screen: 'game', game })} />;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
