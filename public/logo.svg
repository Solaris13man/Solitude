<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="tile" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1d7a42"/>
      <stop offset="58%" stop-color="#135c32"/>
      <stop offset="100%" stop-color="#0e4526"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd95e" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ffd95e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffd95e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe39a"/>
      <stop offset="52%" stop-color="#ffc24b"/>
      <stop offset="100%" stop-color="#ef9a2e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf8ef"/>
      <stop offset="100%" stop-color="#efe7d2"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- felt-green squircle tile with a warm centre glow (firelight) -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#tile)"/>
  <rect x="40" y="40" width="432" height="432" rx="94" fill="none" stroke="#ffd95e" stroke-opacity="0.32" stroke-width="3"/>

  <!-- soft shadow under the card -->
  <rect x="158" y="130" width="196" height="272" rx="22" fill="#06301a" opacity="0.45" filter="url(#sh)"/>
  <!-- the playing card -->
  <rect x="158" y="120" width="196" height="272" rx="22" fill="url(#card)"/>

  <!-- firelight glow behind the heart -->
  <circle cx="256" cy="256" r="118" fill="url(#glow)"/>

  <!-- central amber heart (reads as warm hearth-glow) -->
  <path transform="translate(184,178) scale(6)"
        d="M12 21s-9-5.5-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-9 12-9 12z"
        fill="url(#heart)"/>

  <!-- small corner pip: signals 'playing card' without text -->
  <path transform="translate(176,140) scale(0.95)"
        d="M12 21s-9-5.5-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-9 12-9 12z"
        fill="#ef9a2e" opacity="0.85"/>
</svg>
